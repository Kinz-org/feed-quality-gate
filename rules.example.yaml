# Example rule set for a scraped product/price feed.
#
# Nothing here is specific to this package - the column names are yours. Point
# `id_column` and `timestamp_column` at whatever your feed calls them, list the
# columns that must be populated, and the gate does the rest.
#
# Copy this file, rename it, and edit. Onboarding a new feed should never
# require a code change.

feed_id: example-competitor-prices

# Used to name offending rows in the report and to split clean/quarantined
# output. If omitted, the DataFrame index is used instead.
id_column: product_id

# The column the gate dates the feed by. Required for the freshness check -
# without it the gate cannot tell a live feed from a frozen one, and says so
# rather than silently passing.
timestamp_column: scraped_at

freshness:
  enabled: true
  # Fail once the newest row in the feed is older than this. Set it slightly
  # above your real scrape cadence: a daily scraper wants 2, not 1, so a single
  # missed run warns rather than pages.
  max_age_days: 7
  # Rows dated more than this many hours after "now" are treated as bad
  # timestamps: counted and reported, but never allowed to count as the
  # newest row (one 2099-01-01 value would otherwise hide a stale feed).
  future_tolerance_hours: 1
  severity: fail

completeness:
  enabled: true
  columns:
    # A row with no price cannot participate in a margin calculation, so the
    # tolerance is tight and offending rows are held back.
    price:
      max_null_ratio: 0.02
      severity: fail
      quarantine: true

    # Category drives grouping and comparison. Useful to know about, but a gap
    # here should not stop a pipeline - hence warn, and the rows still flow.
    category:
      max_null_ratio: 0.05
      severity: warn
      quarantine: false

    description:
      max_null_ratio: 0.10
      severity: warn
      quarantine: false

# Off by default: it names two columns ("price" and a source column) that only
# make sense once your feed actually has a source/competitor/scraper-id column
# to group by. `completeness.price` above tolerates 2% missing feed-wide, but
# that average hides a single source that is missing prices on most of its own
# rows. Turn this on once your feed has a
# source column, pointing `column` at the same field you already gate on above.
per_source_completeness:
  enabled: false
  column: price
  source_column: source
  max_null_ratio: 0.10
  severity: fail
  min_source_rows: 3
