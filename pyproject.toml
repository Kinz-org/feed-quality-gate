[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-quality-gate"
version = "0.1.0"
description = "Declarative quality-and-freshness gate for scraped product/price feeds."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Nassim K." }]
keywords = ["data-quality", "data-validation", "etl", "freshness", "pipeline"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

# Core stays deliberately small. analytics-service-toolkit (`astk`) is an
# OPTIONAL extra, not a hard dependency - see README "Relationship to astk".
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Installs analytics-service-toolkit from git (it is public but not on PyPI).
# Kept out of the core dependency list so core stays small.
astk = [
    "analytics-service-toolkit @ git+https://github.com/Kinz-org/analytics-service-toolkit",
]
parquet = ["pyarrow>=15.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
fqg = "feed_quality_gate.cli:main"

[tool.setuptools.packages.find]
include = ["feed_quality_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults. Typer's entire option API is
# built on exactly that (`x: T = typer.Option(...)`), so the rule is a false
# positive here - working around it would mean hand-rolling the parser.
"feed_quality_gate/cli.py" = ["B008"]
